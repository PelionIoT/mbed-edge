name: Signed Windows release
run-name: Signed Windows core ${{ inputs.version }} (${{ inputs.release_id || 'manual' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (major.minor.patch)
        required: true
        type: string
      release_id:
        description: Optional identifier supplied by the full release script
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate release source and version
        run: |
          if (-not (Test-Path build-windows.ps1) -or -not (Test-Path windows/build-openssl.ps1)) { throw 'Select the experiment/win10support branch (or a reviewed Windows release branch) in Run workflow. The default branch currently only registers this manual workflow.' }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Use major.minor.patch.' }
          $version = [version]$env:RELEASE_VERSION
          if ($version.Major -gt 255 -or $version.Minor -gt 255 -or $version.Build -gt 65535) { throw 'Version exceeds MSI limits.' }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build pinned OpenSSL SDK
        run: ./windows/build-openssl.ps1 -OutputDirectory ./build/openssl
      - name: Build Release and native tests
        run: |
          ./build-windows.ps1 -Configuration Release -OpenSSLRoot "$pwd/build/openssl/install" -Jobs 4 -CMakeArgument '-DCMAKE_POLICY_VERSION_MINIMUM=3.5','-DEDGE_WINDOWS_TESTS=ON'
          cmake --build build/windows-x64 --config Release --target windows-core-tests --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Native test build failed.' }
          ctest --test-dir build/windows-x64 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed.' }
      - name: Stage runtime files only
        run: |
          $stage = New-Item -ItemType Directory build/runtime
          foreach ($name in @('edge-core.exe','event.dll','event_core.dll','libcrypto-3-x64.dll','libssl-3-x64.dll')) {
            Copy-Item -LiteralPath "build/windows-x64/bin/Release/$name" -Destination $stage
          }
          Copy-Item LICENSE "$stage/edge-LICENSE.txt"
          Copy-Item build/openssl/openssl-3.5.9/LICENSE.txt "$stage/openssl-LICENSE.txt"
          @{version=$env:RELEASE_VERSION; commit=$env:GITHUB_SHA; profile='BYOC/OpenSSL/Release'; opensslVersion='3.5.9'} | ConvertTo-Json | Set-Content "$stage/build.json" -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-unsigned
          path: build/runtime/
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: windows-2022
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-runtime-unsigned
          path: build/runtime
      - name: Check signing configuration
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNER_SUBJECT: ${{ vars.AZURE_SIGNER_SUBJECT }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','SIGNING_ACCOUNT','SIGNING_PROFILE','SIGNING_ENDPOINT','SIGNER_SUBJECT')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Configure windows-signing variable $name." }
          }
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\runtime
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
      - name: Verify signatures before upload
        shell: powershell
        env:
          SIGNER_SUBJECT: ${{ vars.AZURE_SIGNER_SUBJECT }}
        run: |
          $files = @(Get-ChildItem build/runtime -File | Where-Object Extension -in '.exe','.dll' | Select-Object -ExpandProperty FullName)
          ./windows/verify-signatures.ps1 -Path $files -ExpectedSubject $env:SIGNER_SUBJECT -ReportPath build/runtime/signatures.json
      - uses: actions/upload-artifact@v4
        with:
          name: edge-core-windows-x64-signed
          path: build/runtime/
          if-no-files-found: error
          retention-days: 30
